[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank here - alembic/env.py reads
# DATABASE_URL from your .env at runtime instead, so this file doesn't
# need editing (or risk drifting from the real connection string).
sqlalchemy.url = postgresql://pulse:pulse_secure_password@9gear_pulse_db:5432/pulse_audit

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
